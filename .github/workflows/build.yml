name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        os: [macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Check cache
        run: |
          echo upstream_heads=`git ls-remote https://github.com/theos/theos | head -n 1 | cut -f 1`-`git ls-remote https://github.com/theos/sdks | head -n 1 | cut -f 1` >> $GITHUB_ENV

      - name: Use cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos
          key: ${{ runner.os }}-${{ env.upstream_heads }}

      - name: Prepare Theos
        # Don't use @main in production, this repo is specifically for testing it.
        uses: Randomblock1/theos-action@main

      - name: Build package
        # A tag builds the version the control file names. Everything else gets
        # the run number appended, so installing one test build over another is
        # an upgrade rather than something apt skips as already installed.
        run: |
          rm -rf packages
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            make package FINALPACKAGE=1
          else
            make package FINALPACKAGE=1 PACKAGE_VERSION=$(grep -i "^Version:" control | cut -d" " -f2)-${{ github.run_number }}
          fi

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: "Package built by ${{ matrix.os }}"
          path: ${{ github.workspace }}/packages/*.deb

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" packages/*.deb --generate-notes --title "${GITHUB_REF_NAME}"
